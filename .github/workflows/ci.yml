name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crime_map
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Prepare databases
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE crime_map_test;"
          for db in crime_map crime_map_test; do
            psql -h localhost -U postgres -d "$db" -v ON_ERROR_STOP=1 \
              -f internal/infrastructure/database/schema.sql
          done

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -p 1 -count=1 ./...
