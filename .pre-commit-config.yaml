repos:
- repo: https://github.com/golangci/golangci-lint
  rev: v1.55.2
  hooks:
    - id: golangci-lint
      args: [--timeout=5m, --fast]
      
- repo: https://github.com/dnephin/pre-commit-golang
  rev: v0.5.1
  hooks:
    - id: go-fmt
      args: [./...]
    - id: go-vet
      args: [./...]
    - id: go-imports
      args: [./...]
    - id: go-unit-tests
      args: [./...] 